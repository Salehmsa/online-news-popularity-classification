<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online News Popularity — Interactive Dashboard</title>
<style>
:root{
  color-scheme:light;
  --page:#f4f3f0; --surface:#fcfcfb; --surface-2:#f6f5f2;
  --text:#0b0b0b; --text-2:#52514e; --muted:#6b6a65;
  --border:#e3e2dd; --grid:#ecebe6;
  --s1:#2a78d6; --s1-soft:#cde2fb; --s2:#eb6834;
  --good:#006300; --bad:#b32d2d; --chip-on:#e6f0fc;
  --shadow:0 1px 2px rgba(0,0,0,.05);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#121211; --surface:#1a1a19; --surface-2:#222220;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#9a998f;
  --border:#2f2f2c; --grid:#2a2a27;
  --s1:#3987e5; --s1-soft:#184f95; --s2:#d95926;
  --good:#3fbf3f; --bad:#e66767; --chip-on:#1c2f49;
  --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])):not([data-theme="dark"]){color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 48px}
header.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--text-2);margin:0;max-width:760px}
.tools{display:flex;gap:8px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;min-height:34px}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.row:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--text-2);font-weight:600}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--s1)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
aside.filters{position:sticky;top:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 24px);overflow:auto}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fhead b{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2)}
.fgroup{margin:0 0 12px}
.fgroup>div.lbl{font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12.5px;min-height:28px}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--s1);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--s1)}
main{min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 2px}
.card .hint{color:var(--text-2);font-size:12.5px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{color:var(--text-2);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--text-2)}
.up{color:var(--good)} .down{color:var(--bad)}
.recs{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
.play{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.step{display:flex;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--s1);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.step .tx{flex:1}
.step .m{color:var(--text-2);font-size:12px}
.result{font-size:13px;margin-top:6px}
.result b{font-size:18px}
ul.rl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.rl li{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
ul.rl .h{font-weight:600}
ul.rl .m{color:var(--text-2);font-size:12px}
.tag{display:inline-block;border:1px solid var(--border);border-radius:6px;padding:0 6px;font-size:11px;color:var(--text-2);margin-inline-start:6px;background:var(--surface)}
.sect{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);margin:12px 0 6px;font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.barrow{display:grid;grid-template-columns:84px 1fr 104px;gap:8px;align-items:center;padding:3px 0;border-radius:6px;cursor:pointer}
.barrow:hover{background:var(--surface-2)}
.barrow .lab{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .val{font-size:12.5px;font-variant-numeric:tabular-nums;text-align:end}
.barrow .val i{font-style:normal;color:var(--muted);font-size:11px;margin-inline-start:4px}
.track{position:relative;height:16px;background:var(--grid);border-radius:4px}
.fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--s1);border-radius:0 4px 4px 0;transition:width .25s}
[dir="rtl"] .fill{border-radius:4px 0 0 4px}
.dim .fill{opacity:.35}
.dim .sel .fill,.dim .barrow.on .fill{opacity:1}
.avg{position:absolute;top:-3px;bottom:-3px;width:0;border-inline-start:2px dashed var(--text);opacity:.65}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-top:6px;flex-wrap:wrap}
.legend.avgl span::before{content:"";display:inline-block;width:14px;height:0;border-top:2px dashed var(--text);vertical-align:middle;margin-inline-end:5px;opacity:.65}
svg text{fill:var(--text-2);font:11px system-ui,sans-serif}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);font-size:12.5px;max-width:240px;display:none}
.tip b{font-size:15px;display:block}
.tip .s{color:var(--text-2)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{white-space:nowrap;text-align:start;padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px}
th{color:var(--text-2);font-weight:600}
td.num,th.num{text-align:end}
tr.best td{font-weight:700}
select{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font:inherit}
details.card summary{cursor:pointer;font-weight:600}
.note{color:var(--text-2);font-size:12.5px;margin-top:10px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip-on);border:1px solid var(--s1);font-size:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
ol.pipe{padding-inline-start:20px;margin:6px 0}
ol.pipe li{margin:4px 0}
.hidden{display:none!important}
.foot{margin-top:24px;color:var(--muted);font-size:12px}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  aside.filters{position:static;max-height:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .recs,.grid2,.mgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="subtitle"></p>
    </div>
    <div class="tools">
      <button class="btn" id="langBtn" aria-label="Language"></button>
      <button class="btn" id="themeBtn" aria-label="Theme"></button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-explore" aria-selected="true" data-i="tabExplore"></button>
    <button class="tab" role="tab" id="tab-model" aria-selected="false" data-i="tabModel"></button>

  <section id="view-explore">
    <div class="layout">
      <aside class="filters" aria-label="Filters">
        <div class="fhead"><b data-i="filters"></b><button class="btn" id="resetBtn" data-i="reset"></button></div>
        <div id="fgroups"></div>

      <main>
        <div class="kpis" id="kpis"></div>
        <div class="recs">
          <div class="card" id="playCard"></div>
          <div class="card" id="recCard"></div>
        </div>
        <div class="grid2" id="charts"></div>
        <div class="card" style="margin-top:16px" id="histCard"></div>
        <details class="card" style="margin-top:16px" id="tableCard">
          <summary data-i="tableView"></summary>
          <div style="margin:10px 0"><label><span data-i="dimension"></span> <select id="tblDim"></select></label></div>
          <div id="tblWrap"></div>
        </details>
      </main>
    </div>
  </section>

  <section id="view-model" class="hidden">
    <div class="mgrid">
      <div class="card" id="metricsCard"></div>
      <div class="card" id="rocCard"></div>
    </div>
    <div class="mgrid">
      <div class="card" id="impCard"></div>
      <div class="card" id="methodCard"></div>
    </div>
  </section>

  <p class="foot" data-i="footer"></p>
</div>
<div class="tip" id="tip" role="tooltip"></div>

const DIMS=[{k:'ch',act:1},{k:'wd',act:1},{k:'img',act:1},{k:'vid',act:1},{k:'lnk',act:1},{k:'wrd',act:1},{k:'ttl',act:1},{k:'tone',act:0}];
const NCAT={ch:7,wd:7,img:5,vid:5,lnk:5,wrd:5,ttl:5,tone:5};

let lang=(navigator.language||'en').startsWith('ar')?'ar':'en';
let theme=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
const sel={};DIMS.forEach(d=>sel[d.k]=new Set());
const t=k=>T[lang][k];
const NUMDIM={img:1,vid:1,lnk:1,wrd:1,ttl:1,tone:1};
const lab=(k,i)=>{const v=T[lang].labels[k][i];return NUMDIM[k]?'\u2066'+v+'\u2069':v};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pct=(x,d=1)=>(x*100).toFixed(d)+'%';
const $=id=>document.getElementById(id);
const el=(tag,attrs,html)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- stats ---------- */
function indices(exclude,base){
  const out=[];const src=base||null;const n=src?src.length:N;
  for(let j=0;j<n;j++){
    const i=src?src[j]:j;let ok=true;
    for(const d of DIMS){
      if(d.k===exclude)continue;
      const s=sel[d.k];if(s.size&&!s.has(COL[d.k][i])){ok=false;break}
    }
    if(ok)out.push(i);
  }
  return out;
}
function median(idx){
  if(!idx.length)return 0;
  const a=new Int32Array(idx.length);for(let j=0;j<idx.length;j++)a[j]=SH[idx[j]];
  a.sort();const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function stats(idx){
  let pop=0,sum=0,vir=0;
  for(const i of idx){pop+=POP[i];sum+=SH[i];if(SH[i]>=P90)vir++}
  const n=idx.length;
  return{n,pop,rate:n?pop/n:0,mean:n?sum/n:0,viral:n?vir/n:0,med:median(idx)};
}
const ALL=(()=>{const idx=new Int32Array(N);for(let i=0;i<N;i++)idx[i]=i;return stats(Array.from(idx))})();

/* ---------- tooltip ---------- */
const tip=$('tip');
function showTip(e,html){
  tip.innerHTML=html;tip.style.display='block';
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-14;
  if(y+h>innerHeight-8)y=e.clientY-h-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
const hideTip=()=>{tip.style.display='none'};

/* ---------- filters ---------- */
function buildFilters(){
  const root=$('fgroups');root.innerHTML='';
  DIMS.forEach(d=>{
    const g=el('div',{class:'fgroup'});
    g.appendChild(el('div',{class:'lbl'},esc(T[lang].dims[d.k])));
    const c=el('div',{class:'chips'});
    for(let i=0;i<NCAT[d.k];i++){
      const b=el('button',{class:'chip','aria-pressed':sel[d.k].has(i)?'true':'false'},esc(lab(d.k,i)));
      b.addEventListener('click',()=>toggle(d.k,i));
      c.appendChild(b);
    }
    g.appendChild(c);root.appendChild(g);
  });
}
function toggle(k,i){const s=sel[k];s.has(i)?s.delete(i):s.add(i);render()}

/* ---------- render: KPIs ---------- */
function renderKpis(S){
  const d=(v,base,isPct)=>{
    const diff=isPct?(v-base)*100:(base?(v/base-1)*100:0);
    if(Math.abs(diff)<0.05)return `<span>— ${t('vsAll')}</span>`;const up=diff>=0;const txt=isPct?`${up?'▲ +':'▼ '}${diff.toFixed(1)} ${t('ppAll')}`:`${up?'▲ +':'▼ '}${diff.toFixed(0)}% ${t('vsAll')}`;
    return`<span class="${up?'up':'down'}"><bdi dir="ltr">${txt.split(' ')[0]+' '+txt.split(' ')[1]}</bdi> ${txt.split(' ').slice(2).join(' ')}</span>`;
  };
  const cells=[
    [t('kArticles'),fmt(S.n),`${pct(S.n/N)} ${t('ofAll')}`],
    [t('kPop'),S.n?pct(S.rate):'–',S.n?d(S.rate,ALL.rate,true):''],
    [t('kMedian'),S.n?fmt(S.med):'–',S.n?d(S.med,ALL.med,false):''],
    [t('kMean'),S.n?fmt(S.mean):'–',S.n?d(S.mean,ALL.mean,false):''],
    [t('kViral'),S.n?pct(S.viral):'–',S.n?d(S.viral,ALL.viral,true):'']
  ];
  $('kpis').innerHTML=cells.map(c=>`<div class="kpi"><div class="k">${esc(c[0])}</div><div class="v">${c[1]}</div><div class="d">${c[2]}</div></div>`).join('');
}

/* ---------- recommendations ---------- */
const stepMin=n=>Math.max(50,Math.min(300,Math.round(n*0.1)));
function catStats(idx,k){
  const n=new Int32Array(NCAT[k]),p=new Int32Array(NCAT[k]);
  for(const i of idx){const c=COL[k][i];n[c]++;p[c]+=POP[i]}
  return{n,p};
}
function renderRecs(S,idx){
  const open=DIMS.filter(d=>sel[d.k].size===0);
  const MINN=stepMin(S.n);const minSup=Math.max(40,Math.round(S.n*0.03));
  /* playbook */
  const pc=$('playCard');
  let html=`<h2>${esc(t('playTitle'))}</h2><p class="hint">${esc(t('playHint'))}</p>`;
  if(S.n<150){html+=`<p class="note">${esc(t('noRec'))}</p>`;pc.innerHTML=html;}
  else{
    const steps=[];let cur=idx.slice();let curRate=S.rate;const used=new Set();
    for(let s=0;s<3;s++){
      let best=null;
      for(const d of open){
        if(!d.act||used.has(d.k))continue;
        const cs=catStats(cur,d.k);
        for(let c=0;c<NCAT[d.k];c++){
          if(cs.n[c]<MINN)continue;
          const r=cs.p[c]/cs.n[c];
          if(!best||r>best.r)best={k:d.k,c,r,n:cs.n[c]};
        }
      }
      if(!best||best.r-curRate<0.01)break;
      steps.push(best);used.add(best.k);
      cur=cur.filter(i=>COL[best.k][i]===best.c);curRate=best.r;
    }
    if(!steps.length)html+=`<p class="note">${esc(t('playNone'))}</p>`;
    else{
      html+='<div class="play">';
      let prev=S.rate;
      steps.forEach((st,j)=>{
        html+=`<div class="step"><span class="n">${j+1}</span><div class="tx">${T[lang].act[st.k](esc(lab(st.k,st.c)))}<div class="m">${esc(T[lang].dims[st.k])} · <bdi dir="ltr">${pct(st.r)} (${st.r>=prev?'+':''}${((st.r-prev)*100).toFixed(1)} pp) · n=${fmt(st.n)}</bdi></div></div></div>`;
        prev=st.r;
      });
      const last=steps[steps.length-1];
      html+=`</div><div class="result">${esc(t('playResult'))}: <b><bdi dir="ltr">${pct(last.r)}</bdi></b> <span class="note">${esc(t('playBase'))} <bdi dir="ltr">${pct(S.rate)}</bdi> · <bdi dir="ltr">n=${fmt(last.n)}</bdi> ${esc(t('playN'))}</span></div>`;
    }
    html+=`<p class="note">${S.n<500?esc(t('small'))+' ':''}${esc(t('caveat'))}</p>`;
    pc.innerHTML=html;
  }
  /* recs list */
  const rc=$('recCard');
  const pos=[],neg=[];
  if(S.n>=150){
    for(const d of open){
      const cs=catStats(idx,d.k);
      for(let c=0;c<NCAT[d.k];c++){
        if(cs.n[c]<minSup)continue;
        const r=cs.p[c]/cs.n[c];const lift=r-S.rate;
        const z=lift/Math.sqrt(Math.max(S.rate*(1-S.rate),1e-6)/cs.n[c]);
        const o={k:d.k,c,r,lift,z,n:cs.n[c],act:d.act};
        if(lift>0&&z>=2&&d.act)pos.push(o);
        if(lift<0&&z<=-2)neg.push(o);
      }
    }
  }
  pos.sort((a,b)=>b.lift-a.lift);neg.sort((a,b)=>a.lift-b.lift);
  const uniq=(arr,m)=>{const seen=new Set(),out=[];for(const o of arr){if(seen.has(o.k))continue;seen.add(o.k);out.push(o);if(out.length>=m)break}return out};
  const P=uniq(pos,4),Ng=uniq(neg,3);
  const sig=z=>{const a=Math.abs(z);return a>=4?t('strong'):a>=3?t('moderate'):t('weak')};
  let h2=`<h2>${esc(t('recTitle'))}</h2><p class="hint">${esc(t('recHint'))}</p>`;
  if(!P.length&&!Ng.length)h2+=`<p class="note">${esc(t('noRec'))}</p>`;
  else{
    if(P.length){
      h2+=`<div class="sect">▲ ${esc(t('doMore'))}</div><ul class="rl">`;
      P.forEach(o=>{h2+=`<li><div class="h">${T[lang].act[o.k](esc(lab(o.k,o.c)))}<span class="tag">${esc(sig(o.z))}</span></div><div class="m">${esc(T[lang].dims[o.k])} · <bdi dir="ltr">${pct(o.r)} <span class="up">(+${(o.lift*100).toFixed(1)} pp)</span> · n=${fmt(o.n)}</bdi></div></li>`});
      h2+='</ul>';
    }
    if(Ng.length){
      h2+=`<div class="sect">▼ ${esc(t('avoid'))}</div><ul class="rl">`;
      Ng.forEach(o=>{h2+=`<li><div class="h">${T[lang].avo[o.k](esc(lab(o.k,o.c)))}<span class="tag">${esc(sig(o.z))}</span></div><div class="m">${esc(T[lang].dims[o.k])} · <bdi dir="ltr">${pct(o.r)} <span class="down">(${(o.lift*100).toFixed(1)} pp)</span> · n=${fmt(o.n)}</bdi></div></li>`});
      h2+='</ul>';
    }
  }
  rc.innerHTML=h2;
}

/* ---------- bar charts ---------- */
function renderCharts(){
  const root=$('charts');root.innerHTML='';
  DIMS.forEach(d=>{
    const idx=indices(d.k);
    const cs=catStats(idx,d.k);
    const tot=idx.length;let pop=0;for(const i of idx)pop+=POP[i];
    const avg=tot?pop/tot:0;
    let maxr=0;for(let c=0;c<NCAT[d.k];c++)if(cs.n[c])maxr=Math.max(maxr,cs.p[c]/cs.n[c]);
    const axis=Math.max(.8,Math.ceil(maxr*10)/10);
    const card=el('div',{class:'card'});
    card.appendChild(el('h2',null,`${esc(t('rateBy'))} ${esc(T[lang].dims[d.k])}`));
    card.appendChild(el('p',{class:'hint'},esc(t('clickHint'))));
    const hasSel=sel[d.k].size>0;
    const wrap=el('div',{class:hasSel?'dim':''});
    let order=[...Array(NCAT[d.k]).keys()];
    for(const c of order){
      const n=cs.n[c];const r=n?cs.p[c]/n:0;
      const on=sel[d.k].has(c);
      const row=el('div',{class:'barrow'+(on?' on':''),role:'button',tabindex:'0','aria-pressed':on?'true':'false'});
      row.appendChild(el('div',{class:'lab',title:lab(d.k,c)},esc(lab(d.k,c))));
      const tr=el('div',{class:'track'});
      const f=el('div',{class:'fill'});if(n&&n<30)f.style.opacity='.3';f.style.width=(n?Math.max(r/axis*100,.5):0)+'%';
      tr.appendChild(f);
      if(tot){const a=el('div',{class:'avg'});a.style.insetInlineStart=(avg/axis*100)+'%';tr.appendChild(a)}
      row.appendChild(tr);
      row.appendChild(el('div',{class:'val'},n?`${n<30?'~':''}${pct(r)}<i>n=${fmt(n)}</i>`:'–'));
      const showT=e=>{
        const sub=indices(d.k).filter(i=>COL[d.k][i]===c);
        showTip(e,`<b>${n?pct(r):'–'}</b><span class="s">${esc(T[lang].dims[d.k])}: ${esc(lab(d.k,c))}</span><br><span class="s">${fmt(n)} ${esc(t('articlesWord'))} · ${esc(t('medianWord'))}: ${fmt(median(sub))}</span>`);
      };
      row.addEventListener('pointermove',showT);row.addEventListener('pointerleave',hideTip);
      row.addEventListener('focus',e=>{const r0=row.getBoundingClientRect();showT({clientX:r0.left+40,clientY:r0.top})});row.addEventListener('blur',hideTip);
      row.addEventListener('click',()=>{hideTip();toggle(d.k,c)});
      row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hideTip();toggle(d.k,c)}});
      wrap.appendChild(row);
    }
    card.appendChild(wrap);
    card.appendChild(el('div',{class:'legend avgl'},`<span>${esc(t('avgLine'))}: ${tot?pct(avg):'–'}</span>`));
    root.appendChild(card);
  });
}

/* ---------- histogram ---------- */
function renderHist(idx){
  const BW=.2,NB=30;
  const hist=(ix)=>{const h=new Float64Array(NB);for(const i of ix){const b=Math.min(NB-1,Math.floor(Math.log10(Math.max(SH[i],1))/BW));h[b]++}return h};
  const all=hist(Array.from({length:N},(_,i)=>i));
  const sl=hist(idx);
  const ra=Array.from(all,v=>v/N*100),rs=Array.from(sl,v=>idx.length?v/idx.length*100:0);
  const maxv=Math.max(...ra,...rs,1);
  const W=720,H=240,m={l:44,r:12,t:12,b:34};
  const iw=W-m.l-m.r,ih=H-m.t-m.b,bw=iw/NB;
  const ytop=Math.ceil(maxv/4)*4;
  const y=v=>m.t+ih-(v/ytop)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr" role="img" aria-label="${esc(t('histTitle'))}">`;
  for(let g=0;g<=4;g++){const v=ytop*g/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end">${v.toFixed(0)}%</text>`}
  for(let b=0;b<NB;b++){
    const x=m.l+b*bw;const h=rs[b]/ytop*ih;
    s+=`<rect x="${x+1}" y="${m.t+ih-h}" width="${Math.max(bw-2,1)}" height="${h}" fill="var(--s1)" rx="2"/>`;
  }
  let path='';
  for(let b=0;b<NB;b++){const x=m.l+b*bw+bw/2;path+=(b?'L':'M')+x.toFixed(1)+','+y(ra[b]).toFixed(1)}
  s+=`<path d="${path}" fill="none" stroke="var(--s2)" stroke-width="2"/>`;
  for(let e=0;e<=6;e++){const x=m.l+(e/BW)*bw;if(x>W-m.r+1)break;s+=`<line x1="${x}" x2="${x}" y1="${m.t+ih}" y2="${m.t+ih+4}" stroke="var(--muted)"/><text x="${x}" y="${H-14}" text-anchor="middle">${e===0?'1':e<4?fmt(Math.pow(10,e)):(Math.pow(10,e)>=1e6?'1M':fmt(Math.pow(10,e)/1000)+'K')}</text>`}
  const med=idx.length?median(idx):0;
  if(med>0){const mx=m.l+Math.log10(med)/BW*bw;s+=`<line x1="${mx}" x2="${mx}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text)" stroke-dasharray="4 3" opacity=".7"/><text x="${mx+4}" y="${m.t+10}" style="fill:var(--text)">${esc(t('medianLine'))} ${fmt(med)}</text>`}
  for(let b=0;b<NB;b++){
    s+=`<rect class="hh" data-b="${b}" x="${m.l+b*bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  }
  s+='</svg>';
  const lg=`<div class="legend" style="gap:18px"><span style="--c:var(--s1)"><i style="display:inline-block;width:12px;height:12px;background:var(--s1);border-radius:3px;vertical-align:middle;margin-inline-end:5px"></i>${esc(t('slice'))}</span><span><i style="display:inline-block;width:16px;border-top:2px solid var(--s2);vertical-align:middle;margin-inline-end:5px"></i>${esc(t('allArt'))}</span></div>`;
  const c=$('histCard');
  c.innerHTML=`<h2>${esc(t('histTitle'))}</h2><p class="hint">${esc(t('histHint'))}</p>${s}${lg}`;
  c.querySelectorAll('.hh').forEach(r=>{
    const b=+r.dataset.b;
    r.addEventListener('pointermove',e=>{
      const lo=Math.pow(10,b*BW),hi=Math.pow(10,(b+1)*BW);
      showTip(e,`<b>${rs[b].toFixed(1)}%</b><span class="s">${esc(t('slice'))} · ${fmt(sl[b])} ${esc(t('articlesWord'))}</span><br><span class="s">${fmt(lo)}–${fmt(hi)} shares · ${esc(t('allArt'))}: ${ra[b].toFixed(1)}%</span>`);
    });
    r.addEventListener('pointerleave',hideTip);
  });
}

/* ---------- table ---------- */
function renderTable(){
  const sd=$('tblDim');const cur=sd.value||'ch';
  sd.innerHTML=DIMS.map(d=>`<option value="${d.k}">${esc(T[lang].dims[d.k])}</option>`).join('');
  sd.value=cur;
  const k=sd.value;const idx=indices(k);const cs=catStats(idx,k);
  let best=-1,br=-1;for(let c=0;c<NCAT[k];c++)if(cs.n[c]>=100&&cs.p[c]/cs.n[c]>br){br=cs.p[c]/cs.n[c];best=c}
  let h=`<table><thead><tr><th>${esc(t('cat'))}</th><th class="num">${esc(t('articlesWord'))}</th><th class="num">${esc(t('popRate'))}</th><th class="num">${esc(t('medianWord'))}</th></tr></thead><tbody>`;
  for(let c=0;c<NCAT[k];c++){
    const sub=idx.filter(i=>COL[k][i]===c);
    h+=`<tr class="${c===best?'best':''}"><td>${esc(lab(k,c))}${c===best?' ★':''}</td><td class="num">${fmt(cs.n[c])}</td><td class="num">${cs.n[c]?pct(cs.p[c]/cs.n[c]):'–'}</td><td class="num">${cs.n[c]?fmt(median(sub)):'–'}</td></tr>`;
  }
  $('tblWrap').innerHTML=h+'</tbody></table>';
}

/* ---------- model tab ---------- */
function renderModel(){
  const M=RAW.model;
  const base={acc:.532,prec:.532,rec:1,f1:.695,auc:.5};
  const rows=[[t('base'),base],[t('lr'),M.lr],[t('rf'),M.rf]];
  const keys=['acc','prec','rec','f1','auc'];
  const bestK={};keys.forEach(k=>{bestK[k]=Math.max(...rows.slice(1).map(r=>r[1][k]))});
  let h=`<h2>${esc(t('mTitle'))}</h2><table><thead><tr><th>${esc(t('mModel'))}</th><th class="num">${esc(t('mAcc'))}</th><th class="num">${esc(t('mPrec'))}</th><th class="num">${esc(t('mRec'))}</th><th class="num">${esc(t('mF1'))}</th><th class="num">${esc(t('mAuc'))}</th></tr></thead><tbody>`;
  rows.forEach((r,j)=>{h+=`<tr><td>${esc(r[0])}</td>`+keys.map(k=>`<td class="num" style="${j&&r[1][k]===bestK[k]?'font-weight:700':''}">${r[1][k].toFixed(3)}${j&&r[1][k]===bestK[k]?' ★':''}</td>`).join('')+'</tr>'});
  h+=`</tbody></table><p class="note">${esc(t('mNote'))}</p>`;
  $('metricsCard').innerHTML=h;
  /* ROC */
  const W=420,H=320,m={l:44,r:14,t:10,b:40},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const X=v=>m.l+v*iw,Y=v=>m.t+ih-v*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="direction:ltr" role="img" aria-label="${esc(t('rocTitle'))}">`;
  for(let g=0;g<=4;g++){const v=g/4;s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(2)}</text><text x="${X(v)}" y="${H-22}" text-anchor="middle">${v.toFixed(2)}</text>`}
  s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const path=r=>r.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('');
  s+=`<path d="${path(M.lr.roc)}" fill="none" stroke="var(--s2)" stroke-width="2"/><path d="${path(M.rf.roc)}" fill="none" stroke="var(--s1)" stroke-width="2"/>`;
  s+=`<text x="${X(.5)}" y="${H-6}" text-anchor="middle">${esc(t('fpr'))}</text><text transform="rotate(-90)" x="${-(m.t+ih/2)}" y="12" text-anchor="middle">${esc(t('tpr'))}</text>`;
  s+=`<text x="${X(.97)}" y="${Y(.62)}" text-anchor="end" style="fill:var(--s1);font-weight:700">${esc(t('rf'))} · ${M.rf.auc.toFixed(2)}</text><text x="${X(.97)}" y="${Y(.22)}" text-anchor="end" style="fill:var(--s2);font-weight:700">${esc(t('lr'))} · ${M.lr.auc.toFixed(2)}</text>`;
  s+='</svg>';
  const lg=`<div class="legend"><span style="--x:0"><i style="display:inline-block;width:14px;border-top:2px solid var(--s1);margin-inline-end:5px;vertical-align:middle"></i>${esc(t('rf'))}</span><span><i style="display:inline-block;width:14px;border-top:2px solid var(--s2);margin-inline-end:5px;vertical-align:middle"></i>${esc(t('lr'))}</span></div>`;
  $('rocCard').innerHTML=`<h2>${esc(t('rocTitle'))}</h2><p class="hint">${esc(t('rocHint'))}</p>${s}${lg}`;
  /* importance */
  const mx=Math.max(...M.imp.map(x=>x[1]));
  let ih2=`<h2>${esc(t('impTitle'))}</h2><p class="hint">${esc(t('impHint'))}</p>`;
  M.imp.forEach(([f,v])=>{
    const name=T[lang].feat[f]||f;
    ih2+=`<div class="barrow" style="grid-template-columns:240px 1fr 52px;cursor:default" data-f="${esc(f)}"><div class="lab" title="${esc(name)} (${esc(f)})">${esc(name)}</div><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><div class="val">${(v*100).toFixed(1)}%</div></div>`;
  });
  $('impCard').innerHTML=ih2;
  $('impCard').querySelectorAll('.barrow').forEach(r=>{
    const f=r.dataset.f;
    r.addEventListener('pointermove',e=>showTip(e,`<b>${esc(T[lang].feat[f]||f)}</b><span class="s">${esc(f)}</span>`));
    r.addEventListener('pointerleave',hideTip);
  });
  $('methodCard').innerHTML=`<h2>${esc(t('methodTitle'))}</h2><ol class="pipe">${t('pipe').map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="sect">${esc(t('bq'))}</div><ul class="pipe" style="list-style:disc">${t('bqs').map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="note">${esc(t('limits'))}</p>`;
}

/* ---------- main render ---------- */
function applyStatic(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.documentElement.dataset.theme=theme;
  document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('langBtn').textContent=t('langBtn');
  $('themeBtn').textContent=theme==='dark'?t('themeLight'):t('themeDark');
}
function render(){
  applyStatic();buildFilters();
  const idx=indices(null);const S=stats(idx);
  renderKpis(S);
  if(!S.n){
    $('playCard').innerHTML=$('recCard').innerHTML=`<p class="note">${esc(t('noData'))}</p>`;
  }else renderRecs(S,idx);
  renderCharts();renderHist(idx);renderTable();renderModel();
}
$('langBtn').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';render()});
$('themeBtn').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';render()});
$('resetBtn').addEventListener('click',()=>{DIMS.forEach(d=>sel[d.k].clear());render()});
$('tblDim').addEventListener('change',renderTable);
const showTab=w=>{
  $('view-explore').classList.toggle('hidden',w!=='explore');$('view-model').classList.toggle('hidden',w!=='model');
  $('tab-explore').setAttribute('aria-selected',w==='explore');$('tab-model').setAttribute('aria-selected',w==='model');
};
$('tab-explore').addEventListener('click',()=>showTab('explore'));
$('tab-model').addEventListener('click',()=>showTab('model'));
render();
})();
</script>
</body>
</html>
